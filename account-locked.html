<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>South Africa Reserve Bank | Account Locked</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <aside class="auth-visual">
        <p class="eyebrow">Security alert</p>
        <h1>Account locked.</h1>
        <p>Your transfer could not be completed because your account security was flagged.</p>
      </aside>

      <main class="auth-card">
        <h2>Action required</h2>
        <p class="auth-copy">Your account is locked. You need to come to the bank to resolve the issue.</p>

        <div class="transfer-status">
          <div class="transfer-status-label">Status</div>
          <div class="transfer-progress">
            <span style="width: 99%; background: linear-gradient(90deg, #dc2626, #ef4444);"></span>
          </div>
          <strong id="transfer-progress-text">99%</strong>
        </div>

        <p class="auth-meta"><a href="dashboard.html">Return to dashboard</a></p>
      </main>
    </div>
  </body>
</html>
