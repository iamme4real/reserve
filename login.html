<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>South Africa Reserve Bank | Sign In</title>
    <meta name="description" content="Sign in to your South Africa Reserve Bank account." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell">
      <aside class="auth-visual">
        <p class="eyebrow">Welcome back</p>
        <h1>Access your financial world.</h1>
        <p>
          Manage spending, track savings, and stay on top of every payment from one secure dashboard.
        </p>
      </aside>

      <main class="auth-card">
        <h2>Sign in</h2>
        <p class="auth-copy">Use your email and password to continue to your account.</p>

        <form class="auth-form">
          <div class="field-group">
            <label for="email">Email address</label>
            <input id="email" type="email" placeholder="you@example.com" />
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" />
          </div>

          <div class="form-row">
            <label class="checkbox-wrap">
              <input type="checkbox" />
              <span>Remember me</span>
            </label>
            <a class="link-text" href="#">Forgot password?</a>
          </div>

          <button type="submit" class="button button-primary">Sign in</button>
          <p id="login-message" class="form-message error" aria-live="polite"></p>
        </form>

        <p class="auth-meta">New to South Africa Reserve Bank? <a href="index.html">Open an account</a></p>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
