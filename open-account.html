<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>South Africa Reserve Bank | Open New Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell form-shell">
      <aside class="auth-visual">
        <p class="eyebrow">New account</p>
        <h1>Open a new account</h1>
        <p>Choose the account type that matches your next financial goal.</p>
      </aside>

      <main class="auth-card">
        <h2>Account options</h2>
        <div class="budget-card">
          <div class="budget-row">
            <span>Personal account</span>
            <strong>Available</strong>
          </div>
          <div class="budget-row">
            <span>Business account</span>
            <strong>Available</strong>
          </div>
          <div class="budget-row">
            <span>High-yield savings</span>
            <strong>Open</strong>
          </div>
        </div>

        <p class="auth-meta"><a href="dashboard.html">Back to dashboard</a></p>
      </main>
    </div>
  </body>
</html>
