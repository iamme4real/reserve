<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>South Africa Reserve Bank | Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <div class="page-layout">
      <header class="dashboard-topbar page-topbar">
        <div class="dashboard-meta">
          <div class="brand" aria-label="South Africa Reserve Bank Home">
            <span class="brand-mark">SAR</span>
            <span class="brand-text">
              <strong>South Africa Reserve</strong>
              <small>Bank</small>
            </span>
          </div>
        </div>

        <nav class="page-topbar-menu" id="pageMenu" aria-label="Main navigation">
          <a href="mobile-deposit.html">Mobile deposit</a>
          <a href="check-deposit.html">Check deposit</a>
          <a href="card-controls.html">Card</a>
          <a href="transfer.html">Transfer</a>
          <a href="support.html">Support</a>
        </nav>

        <button class="button button-primary" type="button" onclick="sessionStorage.clear(); window.location.href='login.html';">Log out</button>
      </header>

      <div class="auth-shell form-shell">
        <aside class="auth-visual">
          <p class="eyebrow">Help center</p>
          <h1>Support</h1>
          <p>Speak with our team or review account support resources.</p>
        </aside>

        <main class="auth-card">
          <h2>Need help?</h2>
          <div class="budget-card">
            <div class="budget-row">
              <span>Phone</span>
              <strong>+1 (800) 555-0199</strong>
            </div>
            <div class="budget-row">
              <span>Email</span>
              <strong>support@reservebank.com</strong>
            </div>
            <div class="budget-row">
              <span>Hours</span>
              <strong>24/7</strong>
            </div>
          </div>

          <p class="auth-meta"><a href="dashboard.html">Back to dashboard</a></p>
        </main>
      </div>
    </div>
  </body>
</html>
