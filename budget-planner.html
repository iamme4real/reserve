<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>South Africa Reserve Bank | Budget Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <div class="auth-shell form-shell">
      <aside class="auth-visual">
        <p class="eyebrow">Smart planning</p>
        <h1>Budget planner</h1>
        <p>Track spending, create saving goals, and monitor your monthly habits.</p>
      </aside>

      <main class="auth-card">
        <h2>Plan your month</h2>
        <p class="auth-copy">Your spending is within target.</p>

        <div class="budget-card">
          <div class="budget-row">
            <span>Income</span>
            <strong>R18,500</strong>
          </div>
          <div class="budget-row">
            <span>Expenses</span>
            <strong>R11,200</strong>
          </div>
          <div class="budget-row">
            <span>Savings</span>
            <strong>R7,300</strong>
          </div>
        </div>

        <p class="auth-meta"><a href="dashboard.html">Back to dashboard</a></p>
      </main>
    </div>
  </body>
</html>
